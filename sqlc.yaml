version: "2"
sql:
  - name: authentication
    engine: postgresql
    schema: internal/infra/database/migrations
    queries: internal/authentication/queries
    gen:
      go:
        package: authenticationdb
        out: internal/authentication/repositories/generated
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
