version: "3"

dotenv:
  - .env

tasks:
  run-api:
    desc: Run the LIV DOT API
    cmds:
      - go run ./cmd/api

  run-worker:
    desc: Run the LIV DOT worker
    cmds:
      - go run ./cmd/worker

  admin-create:
    desc: Create an internal admin; pass -email -password -full-name -role
    cmds:
      - go run ./cmd/admin {{.CLI_ARGS}}

  build:
    desc: Build all Go commands
    cmds:
      - go build ./...

  format:
    desc: Format Go source files
    cmds:
      - gofmt -w .

  generate:
    desc: Generate type-safe PostgreSQL query code
    cmds:
      - go tool sqlc generate

  migration-new:
    desc: Create a new Tern migration; pass the name after --
    cmds:
      - go tool tern new --migrations internal/infra/database/migrations {{.CLI_ARGS}}

  migrate:
    desc: Apply pending PostgreSQL migrations
    cmds:
      - go tool tern migrate --config internal/infra/database/tern.conf --migrations internal/infra/database/migrations

  migrate-down:
    desc: Roll back the latest PostgreSQL migration
    cmds:
      - go tool tern migrate --destination -1 --config internal/infra/database/tern.conf --migrations internal/infra/database/migrations

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  check:
    desc: Validate formatting, tests, vet, and builds
    cmds:
      - go tool sqlc generate
      - test -z "$(gofmt -l .)"
      - go test ./...
      - go vet ./...
      - go build ./...

  compose-up:
    desc: Build and start the local stack
    cmds:
      - docker compose up --build -d

  compose-down:
    desc: Stop the local stack
    cmds:
      - docker compose down

  compose-logs:
    desc: Follow local stack logs
    cmds:
      - docker compose logs -f
