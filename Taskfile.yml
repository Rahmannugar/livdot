version: "3"

dotenv:
  - .env

tasks:
  run-api:
    desc: Run the LIV DOT API
    cmds:
      - go run ./cmd/api

  run-worker:
    desc: Run the LIV DOT worker
    cmds:
      - go run ./cmd/worker

  admin-create:
    desc: Create an internal admin; pass -email -password -full-name -role
    cmds:
      - go run ./cmd/admin {{.CLI_ARGS}}

  build:
    desc: Build all Go commands
    cmds:
      - go build ./...

  format:
    desc: Format Go source files
    cmds:
      - gofmt -w .

  generate:
    desc: Generate type-safe PostgreSQL queries and the OpenAPI document
    cmds:
      - go -C tools tool sqlc generate -f ../sqlc.yaml
      - go run ./cmd/openapi

  migration-new:
    desc: Create a new Tern migration; pass the name after --
    cmds:
      - go -C tools tool tern new --migrations ../internal/infra/database/migrations {{.CLI_ARGS}}

  migrate:
    desc: Apply pending PostgreSQL migrations from the deploy command
    cmds:
      - go run ./cmd/migrate -dir internal/infra/database/migrations

  migrate-down:
    desc: Roll back the latest PostgreSQL migration
    cmds:
      - go -C tools tool tern migrate --destination -1 --config ../internal/infra/database/tern.conf --migrations ../internal/infra/database/migrations

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  check:
    desc: Validate formatting, tests, vet, and builds
    cmds:
      - go -C tools tool sqlc generate -f ../sqlc.yaml
      - go run ./cmd/openapi
      - git diff --exit-code -- openapi.json
      - test -z "$(gofmt -l .)"
      - go test ./...
      - go vet ./...
      - go build ./...

  up:
    desc: Start the local stack without forcing an image rebuild
    cmds:
      - docker compose up -d
      - docker compose rm -f migrate

  up-build:
    desc: Build images and start the local stack
    cmds:
      - docker compose up --build -d
      - docker compose rm -f migrate

  down:
    desc: Stop the local stack
    cmds:
      - docker compose down

  logs:
    desc: Follow local stack logs
    cmds:
      - docker compose logs -f
